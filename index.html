<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhavyam Kamal - Photography Portfolio</title>

    <!-- Critical CSS inlined for faster initial render -->
    <style>
        /* Critical above-the-fold styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --color-bg: #FDFDFD;
            --color-text: #2C2C2C;
            --color-text-grey: #7f7f7f;
            --spacing-xs: 9px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            --spacing-3xl: 64px;
            --spacing-4xl: 120px;
            --breakpoint-mobile: 768px;
            --breakpoint-tablet: 900px;
            --max-width-gallery: 1600px;
            --column-gap: var(--spacing-xs);
        }
        html, body {
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        body { overflow-x: hidden; }
        .logo-section {
            text-align: center;
            padding: 40px 0 20px;
            background: var(--color-bg);
        }
        .logo-section h1 {
            font-family: 'Raleway', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--color-text);
        }
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background: var(--color-bg);
            z-index: 1000;
            padding: var(--spacing-sm) 0;
        }
        nav {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
        }
        .gallery {
            max-width: var(--max-width-gallery);
            margin: var(--spacing-lg) var(--spacing-3xl) var(--spacing-4xl);
            padding: 0 var(--spacing-2xl);
            position: relative;
        }
        .photo {
            position: absolute;
            cursor: pointer;
            background: #f5f5f5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .photo.positioned {
            opacity: 1;
        }
        .photo img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>

    <!-- Preload critical resources -->
    <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="style.css"></noscript>

    <!-- Preconnect to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Load fonts asynchronously with optional display to prevent render blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Source+Sans+Pro:wght@600&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Source+Sans+Pro:wght@600&display=optional" rel="stylesheet"></noscript>

    <!-- Inline script for CSS loading fallback -->
    <script>
        // Fallback for browsers that don't support onload on link tags
        !function(e){"use strict";var t=function(t,n,r){var o,i=e.document,c=i.createElement("link");if(n)o=n;else{var a=(i.body||i.getElementsByTagName("head")[0]).childNodes;o=a[a.length-1]}var d=i.styleSheets;c.rel="stylesheet",c.href=t,c.media="only x",function e(t){if(i.body)return t();setTimeout(function(){e(t)})}(function(){o.parentNode.insertBefore(c,n?o:o.nextSibling)});var f=function(e){for(var t=c.href,n=d.length;n--;)if(d[n].href===t)return e();setTimeout(function(){f(e)})};return c.addEventListener&&c.addEventListener("load",r),c.onloadcssdefined=f,f(r),c};"undefined"!=typeof exports?exports.loadCSS=t:e.loadCSS=t}("undefined"!=typeof global?global:this);
    </script>

    <script src="imageLoader.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<!-- Logo Section (scrolls away) -->
<section class="logo-section">
    <h1>Bhavyam Kamal</h1>
</section>

<!-- Sticky Header (stays on scroll) -->
<header role="banner">
    <div class="container">
        <div class="header-logo">Bhavyam Kamal</div>
        <button class="hamburger" aria-label="Open navigation menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav role="navigation" aria-label="Main navigation">
            <button class="menu-close" aria-label="Close navigation menu">&times;</button>
            <ul>
                <li><a href="#home" class="active" aria-current="page">Home</a></li>
                <li><a href="#landscape">Landscape</a></li>
                <li><a href="#portraits">Portraits</a></li>
                <li><a href="#wildlife">Wildlife</a></li>
                <li><a href="#astro">Astro</a></li>
            </ul>
        </nav>
    </div>
</header>

<!-- Photo Gallery - CSS Multi-column Layout -->
<main role="main">
    <section class="gallery" aria-label="Photography gallery">
        <!-- Images loaded dynamically by imageLoader.js -->
    </section>
</main>

<!-- Lightbox Modal -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image lightbox">
    <button class="close" aria-label="Close lightbox">&times;</button>
    <div class="lightbox-spinner"></div>
    <img class="lightbox-content" id="lightbox-img" alt="">
    <button class="prev" aria-label="Previous image">&#10094;</button>
    <button class="next" aria-label="Next image">&#10095;</button>
</div>

</body>
</html>
